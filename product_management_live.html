
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Product Management (Live)</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f0f0f0; }
        input, textarea { padding: 6px; margin: 4px 0; width: 100%; }
        .form-box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        button { padding: 8px 16px; background: #4CAF50; color: white; border: none; cursor: pointer; margin-top: 10px; }
        button:hover { background: #45a049; }
        .action-btn { background-color: #2196F3; margin-right: 5px; }
        .delete-btn { background-color: #f44336; }
    </style>
</head>
<body>

<h1>🛍️ Product Management (Connected to Flask API)</h1>

<div class="form-box">
    <h2 id="formTitle">Add or Edit Product</h2>
    <form id="productForm">
        <input type="hidden" id="product_id">
        <label>Name:</label><input type="text" id="name" required>
        <label>Category:</label><input type="text" id="category">
        <label>Price:</label><input type="number" id="price" step="0.01" required>
        <label>Stock:</label><input type="number" id="stock" required>
        <label>Description:</label><textarea id="description" rows="3"></textarea>
        <button type="submit">Save Product</button>
    </form>
</div>

<h2>📦 Product List</h2>
<table>
    <thead>
        <tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Description</th><th>Actions</th></tr>
    </thead>
    <tbody id="productTable"></tbody>
</table>

<script>
const apiBase = 'http://localhost:5000/api/products';

function loadProducts() {
    fetch(apiBase)
    .then(res => res.json())
    .then(data => {
        const table = document.getElementById('productTable');
        table.innerHTML = '';
        data.forEach(p => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${p.product_id}</td>
                <td>${p.name}</td>
                <td>${p.category}</td>
                <td>${p.price.toFixed(2)}</td>
                <td>${p.stock}</td>
                <td>${p.description}</td>
                <td>
                    <button class="action-btn" onclick='editProduct(${JSON.stringify(p)})'>✏️ Edit</button>
                    <button class="delete-btn" onclick='deleteProduct(${p.product_id})'>🗑️ Delete</button>
                </td>
            `;
            table.appendChild(row);
        });
    });
}

function editProduct(p) {
    document.getElementById('product_id').value = p.product_id;
    document.getElementById('name').value = p.name;
    document.getElementById('category').value = p.category;
    document.getElementById('price').value = p.price;
    document.getElementById('stock').value = p.stock;
    document.getElementById('description').value = p.description;
    document.getElementById('formTitle').innerText = 'Edit Product';
}

function deleteProduct(id) {
    if (confirm('Are you sure you want to delete this product?')) {
        fetch(`${apiBase}/${id}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(() => loadProducts());
    }
}

document.getElementById('productForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const id = document.getElementById('product_id').value;
    const payload = {
        name: document.getElementById('name').value,
        category: document.getElementById('category').value,
        price: parseFloat(document.getElementById('price').value),
        stock: parseInt(document.getElementById('stock').value),
        description: document.getElementById('description').value
    };
    const method = id ? 'PUT' : 'POST';
    const url = id ? `${apiBase}/${id}` : apiBase;

    fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(() => {
        loadProducts();
        document.getElementById('productForm').reset();
        document.getElementById('formTitle').innerText = 'Add or Edit Product';
        document.getElementById('product_id').value = '';
    });
});

loadProducts();
</script>

</body>
</html>
